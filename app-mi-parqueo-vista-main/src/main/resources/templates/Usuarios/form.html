<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id_usuario == null ? 'Nuevo usuario' : 'Editar usuario'}">Formulario de Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-shell"><aside class="sidebar"><h2>MiParqueo</h2><nav><ul><li><a href="/ocupacion">Estado de Ocupación</a></li><li><a href="/movimientos">Movimientos Recientes</a></li><li><a href="/alertas">Alertas</a></li><li><a href="/pagos">Pagos</a></li><li><a href="/ubicacion-vehiculos">Ubicación de Vehículos</a></li><li><a href="/fidelizacion">Fidelización</a></li><li><a class="active" href="/view/usuarios/list">Usuarios</a></li></ul></nav></aside><main class="page-content"><header class="page-header"><div><span class="eyebrow">Administración</span><h1 th:text="${usuario.id_usuario == null ? 'Nuevo usuario' : 'Editar usuario'}">Formulario de Usuario</h1><p>Completa la información para guardar el usuario en la base de datos.</p></div></header><section class="panel form-panel"><form th:action="@{/view/usuarios/save}" th:object="${usuario}" method="post"><input type="hidden" th:field="*{id_usuario}"><div class="form-grid"><label>Documento<input type="number" th:field="*{documento}" placeholder="Número de documento"><small class="field-error" th:errors="*{documento}"></small></label><label>Nombre<input type="text" th:field="*{nombre}" placeholder="Nombre"><small class="field-error" th:errors="*{nombre}"></small></label><label>Apellido<input type="text" th:field="*{apellido}" placeholder="Apellido"><small class="field-error" th:errors="*{apellido}"></small></label><label>Correo electrónico<input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com"><small class="field-error" th:errors="*{correo}"></small></label><label>Teléfono<input type="number" th:field="*{telefono}" placeholder="3000000000"><small class="field-error" th:errors="*{telefono}"></small></label><label>Rol<select th:field="*{rol}"><option value="">Selecciona un rol</option><option value="1">Administrador</option><option value="2">Operador</option></select><small class="field-error" th:errors="*{rol}"></small></label><label class="full-field">Contraseña<input type="password" th:field="*{contrasena}" placeholder="Contraseña de acceso"><small class="field-error" th:errors="*{contrasena}"></small></label></div><div class="form-actions"><a class="outline-button" href="/view/usuarios/list">Cancelar</a><button class="primary-button" type="submit">Guardar usuario</button></div></form></section></main></body>
</html>
